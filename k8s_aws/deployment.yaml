apiVersion: apps/v1
kind: Deployment
metadata:
  name: globeco-fix-engine
  namespace: globeco
  labels:
    app: globeco-fix-engine
spec:
  {{- include "globeco.replicas" . | nindent 2 }}

  # A newly-ready pod must remain ready for 10 seconds before
  # the Deployment considers it available.
  minReadySeconds: 10

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0

  selector:
    matchLabels:
      app: globeco-fix-engine
  template:
    metadata:
      labels:
        app: globeco-fix-engine
    spec:
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z globeco-execution-service-kafka 9092; do echo "Waiting for Kafka..."; sleep 2; done']
        - name: wait-for-postgres
          image: postgres:18.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              until pg_isready -h globeco-fix-engine-postgresql -p 5432 -U postgres; do
                echo "Waiting for PostgreSQL to be ready..."
                sleep 2
              done
              echo "PostgreSQL is ready."
        - name: kafka-stabilization-delay
          image: busybox:1.36
          command: ['sh', '-c', 'echo "Kafka is reachable. Waiting 5s for stabilization..."; sleep 5; echo "Stabilization delay complete."']
      containers:
        - name: globeco-fix-engine
          image: kasbench/globeco-fix-engine:1.0.13
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
          env:
            # Inject the node and pod metadata from the Downward API
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: MY_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Inject the node IP from the Downward API
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP

            # Point OTEL exporter to the local collector on the same node
            
            - name: OTEL_METRICENDPOINT
              value: "$(NODE_IP):4317"

            - name: OTEL_TRACEENDPOINT
              value: "$(NODE_IP):4317"

            # Define standard service identity attributes
            - name: OTEL_SERVICE_NAME
              value: "globeco-fix-engine"  # Fixed to match actual service name
            - name: OTEL_SERVICE_NAMESPACE
              value: "globeco"
            
            # Log level configuration
            - name: LOG_LEVEL
              value: "info"

            # Artificial throttle on Kafka order intake to induce load for
            # autoscaling benchmarks (Go duration string, e.g. "50ms").
            - name: ORDER_INTAKE_SLEEP
              value: "50ms"
            
            # Inject Kubernetes metadata as resource attributes for k8sattributes processor
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: >-
                k8s.pod.ip=$(MY_POD_IP),
                k8s.pod.name=$(MY_POD_NAME),
                k8s.node.name=$(MY_NODE_NAME),
                k8s.namespace.name=$(MY_NAMESPACE)

          resizePolicy:
            - resourceName: cpu
              restartPolicy: NotRequired
            - resourceName: memory
              restartPolicy: RestartContainer
          {{- include "globeco.globecoFixEngineResources" . | nindent 10 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8085
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8085
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
          startupProbe:
            httpGet:
              path: /healthz
              port: 8085
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30

{{- if eq .Values.autoscaler "vpa" }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: globeco-fix-engine-pdb
  namespace: globeco

spec:
  minAvailable: 1

  selector:
    matchLabels:
      app: globeco-fix-engine
{{- end }}
