{{- if eq .Values.autoscaler "keda" -}}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: globeco-fix-engine-scaledobject
  namespace: globeco
  labels:
    app: globeco-fix-engine
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: globeco-fix-engine
  minReplicaCount: 1
  maxReplicaCount: 20
  cooldownPeriod: 300
  pollingInterval: 15
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: globeco-execution-service-kafka.globeco.svc.cluster.local:9092
        topic: orders
        consumerGroup: fix_engine
        lagThreshold: "5"
        offsetResetPolicy: latest
{{- end -}}
